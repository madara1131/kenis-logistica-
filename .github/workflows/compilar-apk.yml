name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p salida
          cp app/build/outputs/apk/release/*.apk "salida/KenisLogistica-v1.0.${{ github.run_number }}.apk"

      - name: Guardar APK (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: KenisLogistica-apk
          path: salida/*.apk

      - name: Publicar link de descarga (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Keni's Logística v1.0.${{ github.run_number }}
          body: "Descarga el archivo .apk de abajo e instálalo en el teléfono o tablet Android."
          files: salida/*.apk
